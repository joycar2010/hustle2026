server {
    server_name qhadmin.hustle2026.xyz;
    include /etc/nginx/snippets/qh-security-headers.conf;

    # 管理后端 API（与用户 Web 共用后端，但走独立子域，鉴权边界清晰）
    location /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass http://127.0.0.1:9091;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # ===== Go-View 数据大屏(独立低代码应用; 后端 goview-serve@9503 SQLite) =====
    location ^~ /goview-api/ {
        proxy_pass http://127.0.0.1:9503/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 20m;
    }
    # 入口HTML禁缓存: 每次发版原子换chunk, 旧index.html缓存会引用已删chunk致懒加载404
    location = /goview/index.html {
        alias /opt/goview/web/index.html;
        include /etc/nginx/snippets/qh-security-headers.conf;
        add_header Cache-Control "no-cache";
    }
    location = /goview/ {
        alias /opt/goview/web/;
        index index.html;
        include /etc/nginx/snippets/qh-security-headers.conf;
        add_header Cache-Control "no-cache";
    }
    location ^~ /goview/ {
        alias /opt/goview/web/;
        try_files $uri $uri/ /goview/index.html;
    }

    # admin SPA 静态产物（与用户 Web 隔离的独立目录）
    # gzip: 全局只压 text/html, 这里补齐 JS/CSS/JSON/字体/SVG
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/javascript text/javascript application/json text/css image/svg+xml application/manifest+json font/woff font/woff2;

    root /opt/quanthedge/admin;
    index index.html;

    # 哈希资源(文件名含内容哈希→不可变): 永久强缓存
    location /assets/ {
        include /etc/nginx/snippets/qh-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    # SPA 入口 & Service Worker: 不缓存, 每次校验, 新发布立即生效
    location = /index.html {
        include /etc/nginx/snippets/qh-security-headers.conf;
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        include /etc/nginx/snippets/qh-security-headers.conf;
        add_header Cache-Control "no-cache";
    }
    location / { try_files $uri $uri/ /index.html; }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/qhadmin.hustle2026.xyz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/qhadmin.hustle2026.xyz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = qhadmin.hustle2026.xyz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name qhadmin.hustle2026.xyz;
    return 404; # managed by Certbot


}
