server {
    server_name qhwww.hustle2026.xyz;
    root /opt/qhwww;
    location ~* .(png|ico|jpg|jpeg|svg|webp|woff2?)$ { add_header Cache-Control "public, max-age=604800"; }
    index index.html;
    # 大文件下载(56MB exe): 关缓冲直传
    location = /QuantHedge-Setup-1.1.0.exe {
        add_header Content-Disposition "attachment; filename=QuantHedge-Setup-1.1.0.exe";
        add_header Cache-Control "no-cache";
    }
    # AI 客服(仅此端点反代到 qh 后端, site=qhwww 隔离)
    location = /api/site/config {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
    }
    location = /api/ai/chat {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
    location / { try_files $uri $uri/ /index.html; }

    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/qhwww.hustle2026.xyz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/qhwww.hustle2026.xyz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = qhwww.hustle2026.xyz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name qhwww.hustle2026.xyz;
    return 404; # managed by Certbot


}