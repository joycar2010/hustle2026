# HustleCoin Mix — 双域同机同后端拓扑（按 Host 收口）
# 教训内置：
#  1) coin 双域事故：用户端 SW(scope=/) 劫持 admin 壳 → admin 域 /sw.js 强制 404 + 绝不注册 SW
#  2) qh 壳缓存吞部署：index.html 一律 no-cache，发布后 curl 公网资源 md5 验证
#  3) testgo /assets-v2 不匹配 immutable location 的坑：assets 前缀统一，勿自创目录名

upstream mix_backend { server 127.0.0.1:8200; }   # 同一后端进程（FastAPI/uvicorn）
upstream mix_ws      { server 127.0.0.1:8201; }   # WS hub（position:updates / user_event）

# ---------------- mixadmin.hustle2026.xyz（后台，qh_admin 改造） ----------------
server {
    listen 443 ssl http2;
    server_name mixadmin.hustle2026.xyz;
    # ssl_certificate ...; ssl_certificate_key ...;   # 走系统设置·SSL 证书模块管理

    root /data/mix/mixadmin-web/dist;

    # admin 域绝不允许 Service Worker（防跨壳劫持）
    location = /sw.js { return 404; }
    location = /registerSW.js { return 404; }

    location = /index.html { add_header Cache-Control "no-cache, must-revalidate"; }
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }

    location /api/ { proxy_pass http://mix_backend; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /ws/  { proxy_pass http://mix_ws; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_read_timeout 300s; }

    # 三分屏墙：免登录只读路由（token 门槛在后端校验），同一 SPA
    # /wall/market /wall/risk 直接走 SPA fallback
    location / { try_files $uri $uri/ /index.html; }
}

# ---------------- mix.hustle2026.xyz（用户端，frontend-go 改造） ----------------
server {
    listen 443 ssl http2;
    server_name mix.hustle2026.xyz;

    root /data/mix/mix-web/dist;

    # 用户端允许 PWA/SW，但 SW 缓存策略必须绕开 /api /ws（前端 SW 清单负责，这里兜底禁缓存）
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location = /index.html { add_header Cache-Control "no-cache, must-revalidate"; }
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }

    location /api/ { proxy_pass http://mix_backend; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /ws/  { proxy_pass http://mix_ws; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_read_timeout 300s; }

    location / { try_files $uri $uri/ /index.html; }
}

# 发布验证（教训固化）：
#   BUILD:  npx vite build --outDir dist_new && ls -d dist_new   # 别依赖任何"自动晋升"
#   SWITCH: mv dist dist.old.$(date +%s) && mv dist_new dist     # 手动原子切换
#   VERIFY: curl -s https://mixadmin.hustle2026.xyz/assets/index-*.js | md5sum   # 公网 md5 对本地 dist
#   USERS:  通知操作员 Ctrl+Shift+R —— WS 重连不重载 JS，旧 bundle 会静默吞新消息
