[package]
name = "mix-ws-hub"
version = "0.1.0"
edition = "2021"
description = "HustleCoin Mix WS HUB — qh-ws-hub 模式适配:三轨鉴权(readonly/operators/JWT)+四频道扇出"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.23"
futures-util = "0.3"
redis = { version = "0.25", features = ["tokio-comp", "aio"] }
tokio-postgres = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dashmap = "6"
tracing = "0.1"
tracing-subscriber = "0.3"
sha2 = "0.10"
hex = "0.4"
jsonwebtoken = "9"

[profile.release]
opt-level = 3
lto = true
