server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name polytest.hustle2026.xyz;
    root /var/www/polytest-releases/polytest-chain-pnl-fix-20261107T042500Z;
    index index.html;
    ssl_certificate /etc/letsencrypt/live/polytest.hustle2026.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/polytest.hustle2026.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header X-Polytest-Revision "polytest-chain-pnl-fix-20261107T042500Z" always;
    location ~ /\. { deny all; }
    location /api/ws/ {
        proxy_pass http://127.0.0.1:8897;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8897;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    location = /health { proxy_pass http://127.0.0.1:8897/api/health; }
    location /assets/ { try_files $uri =404; }
    location = /index.html {
        add_header Cache-Control "no-store, max-age=0";
        add_header X-Polytest-Revision "polytest-chain-pnl-fix-20261107T042500Z" always;
    }
    location / { try_files $uri $uri/ /index.html; }
}
server {
    listen 80;
    listen [::]:80;
    server_name polytest.hustle2026.xyz;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}
