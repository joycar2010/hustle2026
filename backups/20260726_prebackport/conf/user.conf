server {
    listen 80;
    server_name user.hustle2026.xyz;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name user.hustle2026.xyz;
    ssl_certificate /etc/letsencrypt/live/mix.hustle2026.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mix.hustle2026.xyz/privkey.pem;
    root /data/mix/user-web/dist;
    index index.html;
    add_header Cache-Control 'no-cache' always;
    location /api/ { proxy_pass http://127.0.0.1:8200; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; }
    location / { try_files $uri $uri/ /index.html; }
}
