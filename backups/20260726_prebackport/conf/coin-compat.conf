# coin.hustle2026.xyz 兼容入口(MIGRATION-01 §3.2):302→mix统一入口,30天后评估301
server {
    listen 443 ssl;
    server_name coin.hustle2026.xyz coinadmin.hustle2026.xyz;
    ssl_certificate /etc/letsencrypt/live/coin.hustle2026.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/coin.hustle2026.xyz/privkey.pem;
    location / { return 302 https://mix.hustle2026.xyz/mix/today?from=coin; }
}
server {
    listen 80;
    server_name coin.hustle2026.xyz coinadmin.hustle2026.xyz;
    return 301 https://$host$request_uri;
}
