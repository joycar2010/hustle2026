# HustleCoin Mix — 域名重排(2026-07-16):mix=管理端(原mixadmin)/user=投资门户/mixadmin=301退役
# 教训内置: 1)index.html no-cache  2)assets immutable  3)/api /ws /wall network-only(SW不拦)
upstream mix_backend { server 127.0.0.1:8200; }
upstream mix_ws      { server 127.0.0.1:8201; }

# ------- mix.hustle2026.xyz(管理端,原 mixadmin) -------
server {
    listen 443 ssl;
    http2 on;
    server_name mix.hustle2026.xyz;
    root /data/mix/mixadmin-web/dist;
    client_max_body_size 8m;
    ssl_certificate /etc/letsencrypt/live/mix.hustle2026.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mix.hustle2026.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # SW 解禁(PWA):sw.js no-cache 保发布即更新;劫持防线=SW 自身 network-only 绕开 api/ws/wall
    location = /sw.js { add_header Cache-Control "no-cache, must-revalidate"; }
    location = /index.html { add_header Cache-Control "no-cache, must-revalidate"; }
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }

    location /api/v1/ai/ { proxy_pass http://mix_backend; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_read_timeout 180s; proxy_send_timeout 180s; }
    location /api/ { proxy_pass http://mix_backend; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /ws/  { proxy_pass http://mix_ws; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_read_timeout 300s; }

    location / { try_files $uri $uri/ /index.html; }
}

# ------- mixadmin.hustle2026.xyz(退役,301→mix,保留30-60天) -------
server {
    listen 443 ssl;
    http2 on;
    server_name mixadmin.hustle2026.xyz;
    ssl_certificate /etc/letsencrypt/live/mix.hustle2026.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mix.hustle2026.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    # 退役域绝不留 SW(旧访客残留 SW 兜底 404)
    location = /sw.js { return 404; }
    location = /registerSW.js { return 404; }
    location / { return 301 https://mix.hustle2026.xyz$request_uri; }
}

# ------- HTTP 301 -------
server {
    listen 80;
    server_name mix.hustle2026.xyz mixadmin.hustle2026.xyz;
    return 301 https://$host$request_uri;
}
