# DexCexMix ops console (gateway :8000) — moved off 443 to make room for HustleCoin Mix frontends
server {
    listen 8443 ssl;
    http2 on;
    server_name mixadmin.hustle2026.xyz mix.hustle2026.xyz;
    client_max_body_size 8m;
    ssl_certificate /etc/letsencrypt/live/mix.hustle2026.xyz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/mix.hustle2026.xyz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 75s;
    }


}
