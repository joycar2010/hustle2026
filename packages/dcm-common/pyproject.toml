[project]
name = "dcm-common"
version = "0.1.0"
description = "DexCexMix 横切共享包:飞书/节流/总线事件/心跳(从 coin 生产资产抽取,去 ORM 耦合)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "redis>=5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dcm_common*"]
