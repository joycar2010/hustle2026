# CrossArb P0 子域名反代 —— 独立 server block,与生产 coin 主站零交叉。
# 放在测试机本机 nginx 的 /etc/nginx/conf.d/crossarb.conf。
# 看板进程只听 127.0.0.1:@PORT@,仅经本 server 对外暴露。
server {
    listen 80;
    server_name @DOMAIN@;

    # 看板 + API + (可选)WS 全部反代到本机 P0 进程
    location / {
        proxy_pass http://127.0.0.1:@PORT@;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
    }
}
# TLS:运行 `sudo certbot --nginx -d @DOMAIN@` 自动注入 443 块并跳转。
