[package]
name = "qh-ws-hub"
version = "0.1.0"
edition = "2021"
description = "Quant Hedge WebSocket HUB — 从 Python 单 worker 广播解耦, Redis pub/sub 扇出 (立项脚手架)"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.23"
futures-util = "0.3"
redis = { version = "0.25", features = ["tokio-comp", "aio"] }
tokio-postgres = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dashmap = "6"
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
opt-level = 3
lto = true
